<script>
'use strict';
const D=JSON.parse(document.getElementById('reader-data').textContent);
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const all=[...(D.figures||[]),...(D.tables||[])];let currentGroup='main',currentId='',pinned=null;
function normalizedRef(s){return String(s).replace(/^(Fig\.|Table)\s*/i,(m)=>m.toLowerCase().startsWith('fig')?'Fig. ':'Table ').replace(/(?<=\d)[a-z]$/i,'')}
function renderInlineRefs(text){let s=escapeHtml(text);return s.replace(/\b(?:Figs?\.|Figures?|Tables?)\s*S?\d+[a-z]?/gi,m=>{let id=m.replace(/^Figs?\.?\s*|^Figures?\s*|^Tables?\s*/i,'');let key=/^Tab/i.test(m)?`Table ${id}`:`Fig. ${id}`;key=normalizedRef(key);return all.some(f=>f.id===key)?`<button type="button" class="ref-link" data-ref="${escapeHtml(key)}">${m}</button>`:m})}
// Paragraph locators use publication structure, never Word-wide sequence numbers.
const locatorsById={};
function ordinalZh(n){const v='零一二三四五六七八九';if(n<10)return v[n];if(n===10)return '十';if(n<20)return '十'+v[n%10];if(n<100){const a=Math.floor(n/10),b=n%10;return v[a]+'十'+(b?v[b]:'')}return String(n)}
function mainFigNumber(ref){const m=String(ref||'').match(/^Fig\.\s*(\d+)$/i);return m?Number(m[1]):null}
function isResultsSection(section){return section.group_by_main_figure===true || /results?\s*(and|&)\s*discussion/i.test(section.title_en||'')}
function locatorPlan(section){const counters={};let prevFigure=null,prevScope='';
 return (section.blocks||[]).map(block=>{
   const resultSection=isResultsSection(section);
   let fig=null;
   if(resultSection&&prevFigure===null){const first=(section.blocks||[]).flatMap(b=>b.figure_group?[b.figure_group]:b.refs||[]).map(mainFigNumber).find(x=>x!==null);const fallback=(D.figures||[]).filter(f=>f.group==='main').map(f=>mainFigNumber(f.id)).find(x=>x!==null);prevFigure=first??fallback??null}
   if(resultSection){const explicit=mainFigNumber(block.figure_group);const candidates=(block.refs||[]).map(mainFigNumber).filter(x=>x!==null).sort((a,b)=>a-b);
     if(explicit!==null)prevFigure=explicit;
     else if(prevFigure===null&&candidates.length)prevFigure=candidates[0];
     else if(prevFigure!==null){const newer=candidates.filter(x=>x>prevFigure);if(newer.length)prevFigure=newer[0]}
     fig=prevFigure;
   }
   let scope=section.title_en||section.title_zh||section.id;
   if(resultSection&&fig!==null)scope='Fig. '+fig;
   else if(block.subsection_en)scope=scope+' — '+block.subsection_en;
   else if(section.parent_title_en)scope=section.parent_title_en+' — '+scope;
   else if(/^Figure captions?$/i.test(scope)&&block.caption_for)scope+=' — '+block.caption_for;
   counters[scope]=(counters[scope]||0)+1;
   let label=scope+' 第'+ordinalZh(counters[scope])+'段';
   if(/^Figure captions? — Fig\./i.test(scope))label=scope+' 圖說';
   const groupChanged=scope!==prevScope;prevScope=scope;
   return {block, label,scope,fig,groupChanged,resultSection};
 });
}

const secNav=$('#sectionNav'), secHost=$('#sections');
const m=D.meta||{};$('#mast').innerHTML=`<div class="eyebrow">SCIENCE READER · 正文中英逐段對照</div><h1>${escapeHtml(m.title_zh||'')}</h1><div class="en-title">${escapeHtml(m.title_en||'')}</div><div class="metadata">${escapeHtml(m.authors||'')}<br>${escapeHtml(m.version||'')} · ${escapeHtml(m.source||'')}</div><div class="audit">段落：中文完整譯文在上，英文原文緊接在下；原稿數據、引用與圖號保留。圖表以實際來源映射為準。</div>`;
(D.sections||[]).forEach((s,si)=>{
 const a=document.createElement('a');a.href='#'+s.id;a.textContent=s.title_zh||s.title_en||s.id;secNav.append(a);
 const heading=document.createElement('h2');heading.className='section';heading.id=s.id;heading.innerHTML=escapeHtml(s.title_zh||'')+`<em>${escapeHtml(s.title_en||'')}</em>`;secHost.append(heading);
 const planned=locatorPlan(s);
 planned.forEach(({block:b,label,scope,fig,groupChanged,resultSection},bi)=>{
   if(groupChanged&&resultSection&&fig!==null){
     const h=document.createElement('h3');h.className='group-heading';h.id=s.id+'--fig-'+fig;
     const f=(D.figures||[]).find(x=>x.id==='Fig. '+fig);
     const descriptor=(f?.caption_zh||'').split(/[。；]/)[0].slice(0,75);
     h.textContent='Fig. '+fig+(descriptor?'｜'+descriptor:'');secHost.append(h);
     const sub=document.createElement('a');sub.href='#'+h.id;sub.className='subnav';sub.textContent='Fig. '+fig;secNav.append(sub);
   }else if(groupChanged&&!resultSection&&b.subsection_en){
     const h=document.createElement('h3');h.className='group-heading';h.textContent=(b.subsection_zh||b.subsection_en);secHost.append(h);
   }
   locatorsById[b.id]=label;
   const card=document.createElement('article');card.className='block';card.id=b.id;card.dataset.search=[b.zh,b.en,b.id,label].join(' ').toLowerCase();card.dataset.refs=JSON.stringify(b.refs||[]);
   const reflist=(b.refs||[]).filter(r=>all.some(x=>x.id===normalizedRef(r)));
   card.innerHTML=`<div class="pid">${escapeHtml(label)}</div><div class="zh">${renderInlineRefs(b.zh||'')}</div><div class="en"><div class="mark">ENGLISH ORIGINAL · 原始英文</div>${renderInlineRefs(b.en||'')}</div><div class="notes"><textarea data-note="${escapeHtml(b.id)}" placeholder="此段的查核筆記…"></textarea></div>`;secHost.append(card);
 });
});
const refs=D.references||[];$('#refs').innerHTML='<h2>參考文獻 / References</h2>'+(refs.length?'<ol>'+refs.map((r,i)=>`<li><div class="zhref">${escapeHtml(r.zh_title||'')}</div><div class="enref">${escapeHtml(r.en||'')}</div></li>`).join('')+'</ol>':'<p>原稿未提供參考文獻。</p>');
function groupItems(){return currentGroup==='table'?(D.tables||[]):(D.figures||[]).filter(x=>x.group===currentGroup)}
function choose(id){let item=all.find(x=>x.id===id);if(!item)return;currentGroup=('headers_en' in item)?'table':item.group;currentId=item.id;$$('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.gr===currentGroup));populate();render()}
function populate(){const opts=groupItems();$('#chooser').innerHTML=opts.map(x=>`<option value="${escapeHtml(x.id)}">${escapeHtml(x.id)}</option>`).join('');if(!opts.some(x=>x.id===currentId))currentId=opts[0]?.id||'';$('#chooser').value=currentId}
function caption(x){return `<div class="f-id">${escapeHtml(x.id||'')}</div><div class="caption-zh">${escapeHtml(x.caption_zh||x.title_zh||'')}</div><div class="caption-en">${escapeHtml(x.caption_en||x.title_en||'')}</div>`}
function tableHtml(t){const en=t.headers_en||[],zh=t.headers_zh||[],rows=t.rows||[];let head=en.map((x,i)=>`<th>${escapeHtml(zh[i]||'')}<span class="suben">${escapeHtml(x)}</span></th>`).join('');let body=rows.map((row,i)=>'<tr>'+row.map((c,j)=>{let z=t.rows_zh?.[i]?.[j];return `<td>${z!=null&&String(z)!==String(c)?escapeHtml(z)+'<span class="suben">'+escapeHtml(c)+'</span>':escapeHtml(c)}</td>`}).join('')+'</tr>').join('');return `<div class="tbl-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`}
function usageLocations(id){return $$('.block').filter(el=>JSON.parse(el.dataset.refs||'[]').some(r=>normalizedRef(r)===id)).map(el=>({id:el.id,label:locatorsById[el.id]||el.id}))}
function groupLocations(id){return $$('.block').filter(el=>(locatorsById[el.id]||'').startsWith(id+' 第')).map(el=>({id:el.id,label:locatorsById[el.id]}))}
function render(){const v=$('#viewContent');const x=all.find(x=>x.id===currentId);if(!x){v.innerHTML='<div class="placeholder">沒有可顯示的圖表</div>';return}v.innerHTML=(currentGroup==='table'?tableHtml(x):x.data_uri?`<img class="figure-image" data-zoom="1" alt="${escapeHtml(x.id)}" src="${x.data_uri}"/>`:`<div class="placeholder">圖像尚未匯入／此為示範版本</div>`)+caption(x)+`<div class="caption-en">正文直接引用：${usageLocations(x.id).map(p=>`<a href="#${escapeHtml(p.id)}">${escapeHtml(p.label)}</a>`).join(' · ')||'此圖／表未在正文直接引用'}</div>`+(x.group==='main'?`<div class="caption-en">此主圖對應段落：${groupLocations(x.id).map(p=>`<a href="#${escapeHtml(p.id)}">${escapeHtml(p.label)}</a>`).join(' · ')||'尚未分組'}</div>`:'')+(x.verified===false?'<small style="color:#a5671b">注意：圖文對應尚未人工核對</small>':'');renderPin()}
function renderPin(){const root=$('#compare');if(!pinned||pinned.id===currentId){root.classList.remove('on');root.innerHTML='';return}root.classList.add('on');root.innerHTML=`<h4>固定比較：${escapeHtml(pinned.id)}</h4>`+(pinned.data_uri?`<img class="figure-image" data-zoom="1" src="${pinned.data_uri}" alt="${escapeHtml(pinned.id)}"/>`:'<div class="placeholder">固定的是表格或未匯入圖像</div>')+caption(pinned)+`<button id="unpin">取消固定</button>`;$('#unpin').onclick=()=>{pinned=null;renderPin()}}
function move(n){let xs=groupItems();let idx=xs.findIndex(x=>x.id===currentId);if(xs.length)choose(xs[(idx+n+xs.length)%xs.length].id)}
$$('.tabs button').forEach(b=>b.onclick=()=>{currentGroup=b.dataset.gr;currentId='';populate();choose($('#chooser').value||'')});$('#chooser').onchange=e=>choose(e.target.value);$('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);$('#pin').onclick=()=>{pinned=all.find(x=>x.id===currentId);renderPin()};
$('#figureNav').innerHTML=all.map(x=>`<button class="jump" data-id="${escapeHtml(x.id)}">${escapeHtml(x.id)}</button>`).join('');
document.addEventListener('click',e=>{const link=e.target.closest('[data-ref],.jump');if(link){choose(link.dataset.ref||link.dataset.id);document.querySelector('.viewer')?.scrollIntoView({behavior:'smooth',block:'nearest'});return}const im=e.target.closest('img[data-zoom]');if(im){$('#zoom img').src=im.src;$('#zoom').classList.add('on')}});
$('#closeZoom').onclick=()=>$('#zoom').classList.remove('on');$('#zoom').addEventListener('click',e=>{if(e.target.id==='zoom')$('#zoom').classList.remove('on')});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#zoom').classList.remove('on')});
$('#toggleEn').onclick=()=>{document.body.classList.toggle('hide-en');const hide=document.body.classList.contains('hide-en');$$('.en').forEach(x=>x.style.display=hide?'none':'block');$('#toggleEn').textContent=hide?'顯示英文':'收合英文'};
$('#toggleNotes').onclick=()=>{document.body.classList.toggle('notes-on');$('#toggleNotes').textContent=document.body.classList.contains('notes-on')?'隱藏筆記':'查核筆記'};
const NKEY='bilingual-notes-'+(m.title_en||'paper');let notes={};try{notes=JSON.parse(localStorage.getItem(NKEY)||'{}')}catch(e){}
$$('textarea[data-note]').forEach(t=>{t.value=notes[t.dataset.note]||'';t.oninput=()=>{notes[t.dataset.note]=t.value;try{localStorage.setItem(NKEY,JSON.stringify(notes))}catch(e){}}});
$('#exportNotes').onclick=()=>{let data='# 論文查核筆記\n\n'+Object.entries(notes).filter(([k,v])=>v.trim()).map(([k,v])=>'## '+(locatorsById[k]||k)+'\n\n'+v+'\n\n').join('');if(data.length<18){alert('請先輸入查核筆記。');return}const blob=new Blob([data],{type:'text/markdown;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='paper-review-notes.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)};
$('#search').oninput=e=>{const q=e.target.value.trim().toLowerCase();let count=0;$$('article.block').forEach(b=>{let ok=!q||b.dataset.search.includes(q);b.style.display=ok?'':'none';count+=ok?1:0});$('#empty').style.display=count?'none':'block';$('#search').title=`符合 ${count} 個段落`};
populate();if(currentId)choose(currentId);else render();
</script>
</body></html>
